<h1>Subir firma digital</h1>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

{% if presidente.firma_digital %}
    <p>Firma actual:</p>
    <img src="{{ presidente.firma_digital }}" width="200">
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Firma digital</label><br>
    <input type="file" name="firma" accept="image/*" required><br><br>

    <button type="submit">Subir firma</button>
</form>

<br>

<a href="{% url 'panel_presidente' %}">Volver</a>
