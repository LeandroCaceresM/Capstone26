{% extends "base_panel.html" %}

{% block titulo %}
Editar evento
{% endblock %}

{% block contenido %}

<h1>Editar evento</h1>

<form method="POST">
    {% csrf_token %}

    <label>Título</label>
    <input type="text" name="titulo" value="{{ evento.titulo }}" maxlength="120" required>

    <label>Descripción</label>
    <textarea name="descripcion" rows="5">{{ evento.descripcion }}</textarea>

    <label>Fecha y hora</label>
    <input
        type="datetime-local"
        name="fecha_evento"
        value="{{ evento.fecha_evento|date:'Y-m-d\\TH:i' }}"
        required
    >

    <label>Lugar</label>
    <input type="text" name="lugar" value="{{ evento.lugar }}">

    <button type="submit">Guardar cambios</button>
</form>

<br>
<a href="{% url 'gestionar_eventos' %}">Volver</a>

{% endblock %}
