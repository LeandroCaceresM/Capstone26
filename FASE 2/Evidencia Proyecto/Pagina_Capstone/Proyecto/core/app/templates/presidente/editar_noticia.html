{% extends "base_panel.html" %}

{% block titulo %}
Editar noticia
{% endblock %}

{% block contenido %}

<h1>Editar noticia</h1>

<form method="POST">
    {% csrf_token %}

    <label>Título</label>
    <input type="text" name="titulo" value="{{ noticia.titulo }}" maxlength="120" required>

    <label>Contenido</label>
    <textarea name="descripcion" rows="6" required>{{ noticia.descripcion }}</textarea>

    <button type="submit">Guardar cambios</button>
</form>

<br>
<a href="{% url 'gestionar_noticias' %}">Volver</a>

{% endblock %}
