{% extends "base_login.html" %}

{% block titulo %}
Iniciar Sesión
{% endblock %}

{% block contenido %}

<h1>Iniciar Sesión</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Correo</label><br>
        <input type="email" name="correo" placeholder="Tucorreo@ejemplo.com"  required><br><br>

        <label>Contraseña</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Ingresar</button>
    </form>

    <br>

    <a href="{% url 'registro' %}">
        Registrarse
    </a>

    <br><br>

    <a href="{% url 'recuperar_contrasenia' %}">
        Olvidaste tu contraseña?
    </a>
    
{% endblock %}
