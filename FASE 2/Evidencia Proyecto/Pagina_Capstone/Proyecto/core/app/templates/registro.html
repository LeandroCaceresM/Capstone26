<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>

<body>
<h1>Registro de Vecino</h1>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Rut</label><br>
    <input
        type="text"
        id="rut"
        name="rut"
        value="{{ datos.rut|default:'' }}"
        maxlength="12"
        placeholder="12.345.678-K"
        autocomplete="off"
        required
    >
    <br><br>

    <label>Primer Nombre</label><br>
    <input
        type="text"
        name="pri_nombre"
        value="{{ datos.pri_nombre|default:'' }}"
        required
    >
    <br><br>

    <label>Segundo Nombre</label><br>
    <input
        type="text"
        name="seg_nombre"
        value="{{ datos.seg_nombre|default:'' }}"
    >
    <br><br>

    <label>Apellido Paterno</label><br>
    <input
        type="text"
        name="apell_paterno"
        value="{{ datos.apell_paterno|default:'' }}"
        required
    >
    <br><br>

    <label>Apellido Materno</label><br>
    <input
        type="text"
        name="apell_materno"
        value="{{ datos.apell_materno|default:'' }}"
        required
    >
    <br><br>

    <label>Correo</label><br>
    <input
        type="email"
        name="correo"
        value="{{ datos.correo|default:'' }}"
        placeholder="Tucorreo@ejemplo.com" 
        required
    >
    <br><br>

    <label>Teléfono</label><br>
    <input
        type="text"
        name="telefono"
        value="{{ datos.telefono|default:'' }}"
        maxlength="9"
        pattern="[0-9]{8,9}"
        placeholder="Ej: 912345678"
        title="Ingrese un teléfono de 8 o 9 dígitos."
        required
    >
    <br><br>

    <label>Fecha de Nacimiento</label><br>
    <input
        type="date"
        name="fecha_de_nacimiento"
        value="{{ datos.fecha_de_nacimiento|default:'' }}"
        max="{{ fecha_maxima }}"
        required
    >
    <br><br>

    <label>Contraseña</label><br>
    <input
        type="password"
        name="password"
        required
    >
    <br><br>

    <button type="submit">
        Registrarse
    </button>

</form>

<br>

<a href="{% url 'login' %}">
    Volver al Login
</a>

<script src="{% static 'js/rut.js' %}"></script>

</body>
</html>
