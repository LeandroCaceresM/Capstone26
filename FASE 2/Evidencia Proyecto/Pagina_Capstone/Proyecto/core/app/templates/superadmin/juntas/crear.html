{% extends "base_panel.html" %}

{% block titulo %}
Crear Junta
{% endblock %}

{% block contenido %}

<h1>Crear Nueva Junta</h1>

<form method="POST">
    {% csrf_token %}

    <label>Nombre de la junta</label>
    <input type="text" name="nombre" required>

    <label>Dirección sede</label>
    <input type="text" name="direccion" required>

    <label>Región</label>
    <select id="region_select" required>
        <option value="">Seleccione una región</option>
        {% for region in regiones %}
            <option value="{{ region.id_region }}">
                {{ region.nom_region }}
            </option>
        {% endfor %}
    </select>

    <label>Comuna</label>
    <select id="comuna_select" required disabled>
        <option value="">Primero seleccione una región</option>
        {% for comuna in comunas %}
            <option
                value="{{ comuna.id_comuna }}"
                data-region="{{ comuna.id_region.id_region }}"
            >
                {{ comuna.nom_comuna }}
            </option>
        {% endfor %}
    </select>

    <label>Sector</label>
    <select name="id_sector" id="sector_select" required disabled>
        <option value="">Primero seleccione una comuna</option>
        {% for sector in sectores %}
            <option
                value="{{ sector.id_sector }}"
                data-comuna="{{ sector.id_comuna.id_comuna }}"
            >
                {{ sector.nombre_sector }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Guardar Junta</button>
</form>

<br>

<a href="{% url 'listar_juntas' %}">Volver</a>

<script>
    const regionSelect = document.getElementById("region_select");
    const comunaSelect = document.getElementById("comuna_select");
    const sectorSelect = document.getElementById("sector_select");

    const comunaOptions = Array.from(comunaSelect.options).filter(option => option.value !== "");
    const sectorOptions = Array.from(sectorSelect.options).filter(option => option.value !== "");

    function resetComunas(){
        comunaSelect.innerHTML = '<option value="">Primero seleccione una región</option>';
        comunaSelect.disabled = true;
    }

    function resetSectores(){
        sectorSelect.innerHTML = '<option value="">Primero seleccione una comuna</option>';
        sectorSelect.disabled = true;
    }

    regionSelect.addEventListener("change", () => {
        const regionId = regionSelect.value;

        resetComunas();
        resetSectores();

        if(!regionId) return;

        comunaSelect.innerHTML = '<option value="">Seleccione una comuna</option>';

        comunaOptions.forEach(option => {
            if(option.dataset.region === regionId){
                comunaSelect.appendChild(option.cloneNode(true));
            }
        });

        comunaSelect.disabled = false;
    });

    comunaSelect.addEventListener("change", () => {
        const comunaId = comunaSelect.value;

        resetSectores();

        if(!comunaId) return;

        sectorSelect.innerHTML = '<option value="">Seleccione un sector</option>';

        sectorOptions.forEach(option => {
            if(option.dataset.comuna === comunaId){
                sectorSelect.appendChild(option.cloneNode(true));
            }
        });

        sectorSelect.disabled = false;
    });

    resetComunas();
    resetSectores();
</script>

{% endblock %}
