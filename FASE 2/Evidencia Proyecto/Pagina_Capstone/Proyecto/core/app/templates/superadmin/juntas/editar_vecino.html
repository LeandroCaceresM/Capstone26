<h1>Editar vecino de la junta</h1>

<p><strong>Junta:</strong> {{ junta.nombre }}</p>

{% if messages %}
    {% for message in messages %}
        <div style="padding:10px; margin-bottom:10px; border:1px solid #ccc;">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}

    <h2>Datos del vecino</h2>

    <label>Primer nombre</label><br>
    <input type="text" name="pri_nombre" value="{{ vecino.pri_nombre }}" required><br><br>

    <label>Segundo nombre</label><br>
    <input type="text" name="seg_nombre" value="{{ vecino.seg_nombre|default_if_none:'' }}"><br><br>

    <label>Apellido paterno</label><br>
    <input type="text" name="apell_paterno" value="{{ vecino.apell_paterno }}" required><br><br>

    <label>Apellido materno</label><br>
    <input type="text" name="apell_materno" value="{{ vecino.apell_materno }}" required><br><br>

    <label>Correo</label><br>
    <input type="email" name="correo" value="{{ vecino.correo|default_if_none:'' }}"><br><br>

    <label>Teléfono</label><br>
    <input type="number" name="telefono" value="{{ vecino.telefono }}" required><br><br>

    <h2>Datos de vivienda</h2>

    <label>Tipo vivienda</label><br>
    <select name="tipo_vivienda" id="tipo_vivienda" required>
        <option value="C" {% if vivienda.tipo_vivienda == "C" %}selected{% endif %}>Casa</option>
        <option value="D" {% if vivienda.tipo_vivienda == "D" %}selected{% endif %}>Departamento</option>
    </select>

    <br><br>

    <label>Nombre calle</label><br>
    <input type="text" name="nombre_calle" value="{{ vivienda.nombre_calle }}" required><br><br>

    <label>Número calle</label><br>
    <input type="number" name="numero_calle" value="{{ vivienda.numero_calle }}" required><br><br>

    <div id="campos_departamento">
        <label>Número block</label><br>
        <input type="number" name="num_block" id="num_block" value="{{ vivienda.num_block|default_if_none:'' }}"><br><br>

        <label>Número departamento</label><br>
        <input type="number" name="num_dpto" id="num_dpto" value="{{ vivienda.num_dpto|default_if_none:'' }}"><br><br>
    </div>

    <button type="submit">Guardar cambios</button>
</form>

<br>

<a href="{% url 'vecinos_junta' junta.id_junta %}">Volver</a>

<script>
    const tipoVivienda = document.getElementById("tipo_vivienda");
    const camposDepartamento = document.getElementById("campos_departamento");
    const numBlock = document.getElementById("num_block");
    const numDpto = document.getElementById("num_dpto");

    function actualizarCampos() {
        if (tipoVivienda.value === "D") {
            camposDepartamento.style.display = "block";
            numBlock.required = true;
            numDpto.required = true;
        } else {
            camposDepartamento.style.display = "none";
            numBlock.required = false;
            numDpto.required = false;
            numBlock.value = "";
            numDpto.value = "";
        }
    }

    tipoVivienda.addEventListener("change", actualizarCampos);
    actualizarCampos();
</script>
