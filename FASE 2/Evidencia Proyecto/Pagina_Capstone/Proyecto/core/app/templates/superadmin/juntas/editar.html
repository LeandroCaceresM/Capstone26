{% extends "base_panel.html" %}

{% block titulo %}
Editar Junta
{% endblock %}

{% block contenido %}

<h1>Editar Junta</h1>

<form method="POST">
    {% csrf_token %}

    <label>Nombre de la junta</label>
    <input type="text" name="nombre" value="{{ junta.nombre }}" required>

    <label>Dirección sede</label>
    <input type="text" name="direccion" value="{{ junta.direccion }}" required>

    <label>Región</label>
    <select id="region_select" required>
        <option value="">Seleccione una región</option>
        {% for region in regiones %}
            <option value="{{ region.id_region }}"
                {% if region.id_region == junta.id_sector.id_comuna.id_region.id_region %}selected{% endif %}>
                {{ region.nom_region }}
            </option>
        {% endfor %}
    </select>

    <label>Comuna</label>
    <select id="comuna_select" required>
        <option value="">Seleccione una comuna</option>
        {% for comuna in comunas %}
            <option
                value="{{ comuna.id_comuna }}"
                data-region="{{ comuna.id_region.id_region }}"
                {% if comuna.id_comuna == junta.id_sector.id_comuna.id_comuna %}selected{% endif %}
            >
                {{ comuna.nom_comuna }}
            </option>
        {% endfor %}
    </select>

    <label>Sector</label>
    <select name="id_sector" id="sector_select" required>
        <option value="">Seleccione un sector</option>
        {% for sector in sectores %}
            <option
                value="{{ sector.id_sector }}"
                data-comuna="{{ sector.id_comuna.id_comuna }}"
                {% if sector.id_sector == junta.id_sector.id_sector %}selected{% endif %}
            >
                {{ sector.nombre_sector }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Actualizar Junta</button>
</form>

<br>

<a href="{% url 'listar_juntas' %}">Volver</a>

<script>
    const regionSelect = document.getElementById("region_select");
    const comunaSelect = document.getElementById("comuna_select");
    const sectorSelect = document.getElementById("sector_select");

    const comunaActual = "{{ junta.id_sector.id_comuna.id_comuna }}";
    const sectorActual = "{{ junta.id_sector.id_sector }}";

    const comunaOptions = Array.from(comunaSelect.options).filter(option => option.value !== "");
    const sectorOptions = Array.from(sectorSelect.options).filter(option => option.value !== "");

    function cargarComunas(regionId, mantenerActual = false){
        comunaSelect.innerHTML = '<option value="">Seleccione una comuna</option>';

        comunaOptions.forEach(option => {
            if(option.dataset.region === regionId){
                comunaSelect.appendChild(option.cloneNode(true));
            }
        });

        comunaSelect.disabled = false;

        if(mantenerActual){
            comunaSelect.value = comunaActual;
        }
    }

    function cargarSectores(comunaId, mantenerActual = false){
        sectorSelect.innerHTML = '<option value="">Seleccione un sector</option>';

        sectorOptions.forEach(option => {
            if(option.dataset.comuna === comunaId){
                sectorSelect.appendChild(option.cloneNode(true));
            }
        });

        sectorSelect.disabled = false;

        if(mantenerActual){
            sectorSelect.value = sectorActual;
        }
    }

    regionSelect.addEventListener("change", () => {
        cargarComunas(regionSelect.value, false);
        sectorSelect.innerHTML = '<option value="">Seleccione una comuna primero</option>';
        sectorSelect.disabled = true;
    });

    comunaSelect.addEventListener("change", () => {
        cargarSectores(comunaSelect.value, false);
    });

    cargarComunas(regionSelect.value, true);
    cargarSectores(comunaActual, true);
</script>

{% endblock %}
