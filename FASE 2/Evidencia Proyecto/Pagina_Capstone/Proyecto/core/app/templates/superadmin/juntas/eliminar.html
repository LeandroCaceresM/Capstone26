<h1>Eliminar Junta</h1>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<p>¿Seguro que deseas eliminar la junta "{{ junta.nombre }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>

<br>

<a href="{% url 'listar_juntas' %}">Cancelar</a>
