{% extends "base.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block body %}

<div class="login-page">
    <div class="login-card">

        <div class="login-brand">
            <h1>UrbanLink</h1>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block contenido %}
        {% endblock %}

    </div>
</div>

{% endblock %}
