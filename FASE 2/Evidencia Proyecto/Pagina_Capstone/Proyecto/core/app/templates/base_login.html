{% extends "base.html" %}

{% block body %}

<div class="container">

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block contenido %}
    {% endblock %}

</div>

{% endblock %}
