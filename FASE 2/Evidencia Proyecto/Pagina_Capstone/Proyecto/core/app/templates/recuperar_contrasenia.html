{% extends "base_login.html" %}

{% block titulo %}
Recuperar Contraseña
{% endblock %}

{% block contenido %}

<h1>Recuperar Contraseña</h1>

<form method="POST" action="{% url 'enviar_recuperacion' %}">

    {% csrf_token %}

    <label>Correo</label><br>

    <input 
        type="email" 
        name="correo" 
        placeholder="Tucorreo@ejemplo.com" 
        required
    >

    <br><br>

    <button type="submit">
        Enviar recuperación
    </button>

    <br><br>
    
    <a href="{% url 'login' %}">
        Volver al Login
    </a>
</form>

</body>
</html>

{% endblock %}
