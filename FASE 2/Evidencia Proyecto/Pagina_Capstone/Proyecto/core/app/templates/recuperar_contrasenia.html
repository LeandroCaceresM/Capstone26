{% extends "base_login.html" %}

{% block titulo %}
Recuperar Contraseña
{% endblock %}

{% block contenido %}

<h2>Recuperar Contraseña</h2>

<p class="login-description">
    Ingresa el correo asociado a tu cuenta. Se enviará un enlace para restablecer tu contraseña.
</p>

<form method="POST" action="{% url 'enviar_recuperacion' %}">
    {% csrf_token %}

    <label>Correo electrónico</label>

    <input
        type="email"
        name="correo"
        placeholder="Tucorreo@ejemplo.com"
        required
    >

    <button class="login-btn" type="submit">
        Enviar recuperación
    </button>
</form>

<div class="login-links">
    <a href="{% url 'login' %}">
        Volver al Login
    </a>
</div>

{% endblock %}
